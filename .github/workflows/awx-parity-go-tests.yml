name: AWX parity Go verification

on:
  push:
    branches:
      - feature/awx-parity
    paths:
      - 'db/**'
      - 'pro/**'
      - 'services/tasks/**'
      - 'services/runners/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/awx-parity-go-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go formatting
        run: |
          files="$(gofmt -l db/sql/oidc_group_mapping_store.go db/sql/oidc_group_mapping_sync.go db/sql/oidc_mapping_schema_test.go db/sql/oidc_group_mapping_sync_test.go pro/api/role_mappings.go pro/api/role_mappings_test.go pro/services/server/keycloak_groups.go pro/services/server/keycloak_groups_test.go pro/services/server/role_sync_svc.go pro/services/server/role_sync_svc_test.go pro/db/factory/factory.go 2>/dev/null || true)"
          if [ -n "$files" ]; then echo "$files"; exit 1; fi
      - name: Targeted OIDC and RBAC tests
        run: go test -count=1 -timeout=10m ./db/sql ./pro/api ./pro/services/server ./pro/db/factory
      - name: Runner scheduling and execution tests
        run: go test -count=1 -timeout=10m ./db ./services/tasks ./services/runners
      - name: API compilation
        run: go test -run '^$' ./api/...
